[package]
name = "gdl-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gdl_core = { path = "../core" }
wasm-bindgen = "0.2"

# Keeps this crate out of the parent workspace (it needs the wasm toolchain).
[workspace]

[profile.release]
opt-level = "s"
lto = true
